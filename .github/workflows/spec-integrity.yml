name: Specification integrity

on:
  pull_request:
    paths:
      - ".github/workflows/spec-integrity.yml"
      - "Makefile"
      - "PROJECT_STANDARDS.md"
      - "Kyokaishape.md"
      - "kyokaidecided.md"
      - "kyokaiproofstatus.md"
      - "kyokaiproofstatus.toml"
      - "phase.md"
      - "docs/contributing/spec-writing.md"
      - "kyokaicalculus/**"
      - "kyokaispec/**"
      - "toolchain/prooftrace/**"
      - "toolchain/spec/**"
  push:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/spec-integrity.yml"
      - "Makefile"
      - "PROJECT_STANDARDS.md"
      - "Kyokaishape.md"
      - "kyokaidecided.md"
      - "kyokaiproofstatus.md"
      - "kyokaiproofstatus.toml"
      - "phase.md"
      - "docs/contributing/spec-writing.md"
      - "kyokaicalculus/**"
      - "kyokaispec/**"
      - "toolchain/prooftrace/**"
      - "toolchain/spec/**"

permissions:
  contents: read

concurrency:
  group: spec-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Clause, source, and evidence integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify specification integrity
        run: make check-spec-integrity
