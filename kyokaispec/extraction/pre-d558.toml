[[decision]]
id = "D2"
state = "complete"
source_anchor = "- `**defer` statement** — Zig-style scope-exit semantics. `defer destroyByteBuf(x);` appears at declaration point and runs when the enclosing scope exits. This matches Austral's linearity scope model — linear variables must be consumed before their scope exits, and scope-exit defer does exactly that. `errdefer action(value);` registers source-visible LIFO cleanup for structured error exits only: `return Err(...)` and `or return`. It does not run on panic, TPOE, runtime-fatal termination, normal success, `break`, or `continue`. **[STAGE: DECIDED_CORE_SEMANTICS | D2 → source-visible LIFO scope-exit cleanup]**"
categories = ["syntax-api", "static", "dynamic", "ownership", "borrow", "failure", "diagnostic", "example", "illegal-form", "conformance"]
destinations = ["kyokaispec/src/language/03-grammar.md", "kyokaispec/src/language/10-statements-and-control-flow.md", "kyokaispec/src/language/11-linearity-borrowing-and-regions.md", "kyokaispec/src/language/13-contracts-and-runtime-failure.md", "kyokaispec/src/rationale/03-error-handling-and-tpoe.md", "kyokaispec/src/rationale/04-linear-resources.md"]
required_terms = ["defer", "errdefer"]
