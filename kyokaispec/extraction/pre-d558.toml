[[decision]]
id = "D87"
state = "complete"
source_anchor = "4. **The Implicit-Operation Rule (Tautology Rule)** — Kyokai's philosophy is NOT \"no implicit anything.\" It IS \"no ambiguous, effectful, or semantically surprising implicitness.\" Specifically: **the compiler may insert or complete an omitted operation implicitly if and only if (1) it is uniquely determined by the static types and surrounding context, (2) all alternative programs are statically ill-typed, and (3) the implicit completion does not introduce any new control flow, allocation, or side effects beyond what the explicit program already implies.** This rule governs D7b (auto-reborrow), D8 (implicit Unit return), D12 (literal inference), D15 (`or return` sugar), D34 (auto-deref for fields), and D46 (let inference). If a proposed feature cannot satisfy all three conditions, it is not eligible for implicit treatment. **[STAGE: DECIDED_CORE_SEMANTICS | D87 → formal tautology rule for effect-neutral implicit completion]**"
